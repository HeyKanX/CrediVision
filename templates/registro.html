<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>CrediVision · Registro</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/styles.css') }}">
</head>
<body class="auth-page">
    <main class="auth-card">
        <a class="brand auth-brand" href="{{ url_for('iniciar_sesion') }}">
            <span class="brand-mark">C</span>
            <span>CrediVision</span>
        </a>
        <p class="eyebrow">Nueva cuenta</p>
        <h1>Crear una cuenta</h1>
        <p class="auth-copy">Registra tus datos para acceder al proyecto.</p>

        {% with mensajes = get_flashed_messages(with_categories=true) %}
            {% for categoria, mensaje in mensajes %}
            <div class="alert {{ categoria }}" role="alert">{{ mensaje }}</div>
            {% endfor %}
        {% endwith %}

        <form class="auth-form" method="post">
            <label>
                Nombre completo <span class="optional">(opcional)</span>
                <input name="nombre" autocomplete="name" maxlength="120">
            </label>
            <label>
                Usuario
                <input name="usuario" autocomplete="username" minlength="3" maxlength="80" required autofocus>
            </label>
            <label>
                Correo electrónico
                <input name="email" type="email" autocomplete="email" maxlength="254" required>
            </label>
            <label>
                Contraseña
                <input name="contrasena" type="password" autocomplete="new-password" minlength="8" required>
            </label>
            <label>
                Confirmar contraseña
                <input name="confirmacion" type="password" autocomplete="new-password" minlength="8" required>
            </label>
            <button class="button primary" type="submit">Crear cuenta</button>
        </form>
        <p class="auth-footer">¿Ya tienes una cuenta? <a href="{{ url_for('iniciar_sesion') }}">Inicia sesión</a></p>
    </main>
</body>
</html>
